name: just_asset_store_site
description: "The Just Asset Store's publish app (asset.justunknown.com/publish and /me): sign in with GitHub, submit a package, report one. The rest of the site is static pages (packages/just_asset_store_pages)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Just Unknown packages
  just_unknown_design:
    path: packages/just_unknown_design
  # The words, links and routes the static pages use too.
  just_asset_store_pages:
    path: packages/just_asset_store_pages
  # Claim codes. From pub.dev; for development, the engine workspace's
  # working copy, through the gitignored pubspec_overrides.yaml.
  just_asset_store: ^0.2.0
  just_signals: ^1.0.2
  just_di: ^1.0.0
  just_storage: ^1.2.1
  # Adaptive widgets in the SDK refer to its font.
  cupertino_icons: ^1.0.8

  # Routing / platform
  go_router: ^17.3.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  web: ^1.1.1

  # Sign-in and submissions
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  args: ^2.7.0

flutter:
  uses-material-design: true
