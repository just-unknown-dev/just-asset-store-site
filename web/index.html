<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080B17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Just Asset Store">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/packages/just_unknown_design/assets/fonts/SpaceGrotesk-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/packages/just_unknown_design/assets/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <script>try{if(localStorage.getItem('just_storage:theme_mode')==='light'){document.documentElement.classList.add('light')}}catch(e){}</script>
  <style>/*SHELL_CSS*//*/SHELL_CSS*/</style>
  <!--SEO_HEAD-->
  <title>Just Asset Store</title>
  <meta name="description" content="Art, genre kits, editor tools and project templates for the Just Game Engine.">
  <!--/SEO_HEAD-->
</head>
<body>
  <div id="static-shell"><!--SEO_BODY--><!--/SEO_BODY--></div>
  <script>
    (function () {
      function hide() {
        var s = document.getElementById('static-shell');
        if (!s) return;
        window.__shellScrollY = window.scrollY || 0;
        s.classList.add('is-hidden');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 220);
      }
      window.addEventListener('flutter-first-frame', hide, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
