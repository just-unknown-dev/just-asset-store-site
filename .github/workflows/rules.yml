# Firestore's rules and indexes, deployed when they change on main (and
# by hand). Its own service account: Firebase Rules Admin and Cloud
# Datastore Index Admin, nothing else.
name: Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_TOOLS_VERSION: '15.34.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Writes a credentials file firebase-tools reads (no key stored).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_SERVICE_ACCOUNT }}

      - name: Deploy
        run: >-
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy
          --only firestore:rules,firestore:indexes
          --project "${{ vars.FIREBASE_PROJECT }}" --non-interactive
